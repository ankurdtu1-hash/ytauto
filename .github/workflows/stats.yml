name: stats

# Read-only: subscriber, view, like and comment counts for both channels.
on:
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - env:
          T1: ${{ secrets.YOUTUBE_TOKEN_JSON_TRENDING }}
          T2: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$T1" > t1.json; printf '%s' "$T2" > t2.json
          python tools/stats.py t1.json t2.json
          rm -f t1.json t2.json
