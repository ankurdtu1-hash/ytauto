name: stats

# Read-only: subscriber, view, like and comment counts for both channels.
on:
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - env:
          T1: ${{ secrets.YOUTUBE_TOKEN_JSON_TRENDING }}
          T2: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          T3: ${{ secrets.YOUTUBE_TOKEN_JSON_CRICKET }}
          T4: ${{ secrets.YOUTUBE_TOKEN_JSON_ANIMALS }}
          T5: ${{ secrets.YOUTUBE_TOKEN_JSON_PLACES }}
          T6: ${{ secrets.YOUTUBE_TOKEN_JSON_MONEY }}
        run: |
          files=""; for n in 1 2 3 4 5 6; do v="T$n"; if [ -n "${!v}" ]; then printf '%s' "${!v}" > t$n.json; files="$files t$n.json"; fi; done
          python tools/stats.py $files
          rm -f t?.json
