name: shorts

# Every channel: one Short a day. Every 2 hours each channel checks whether its daily publish slot is within
# 10 hours and has no video yet; then it makes one and schedules it on YouTube (publishAt) for that slot.
# A channel whose YouTube token secret is not set yet is skipped.
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "which channel"
        type: choice
        options: [trending, main, cricket, animals, places, money]
        default: trending
      upload:
        description: "upload to YouTube"
        type: boolean
        default: true
      publish_now:
        description: "public right away (untick: next free time slot)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  short:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2   # free Gemini / Cloudflare limits
      matrix:
        include:
          - {profile: trending, token: YOUTUBE_TOKEN_JSON_TRENDING}
          - {profile: main, token: YOUTUBE_TOKEN_JSON}
          - {profile: cricket, token: YOUTUBE_TOKEN_JSON_CRICKET}
          - {profile: animals, token: YOUTUBE_TOKEN_JSON_ANIMALS}
          - {profile: places, token: YOUTUBE_TOKEN_JSON_PLACES}
          - {profile: money, token: YOUTUBE_TOKEN_JSON_MONEY}
    concurrency:
      group: short-${{ matrix.profile }}
      cancel-in-progress: false
    env:
      CHANNEL_PROFILE: ${{ matrix.profile }}
      HAS_TOKEN: ${{ secrets[matrix.token] != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Is a video needed now?
        id: due
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then echo "no YouTube token for this channel yet"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" != "schedule" ]; then
            [ "${{ inputs.channel }}" = "${{ matrix.profile }}" ] && echo "go=true" >> "$GITHUB_OUTPUT" || echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pip install -q python-dotenv
          python tools/due.py 10

      - if: steps.due.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg, fonts and Python packages
        if: steps.due.outputs.go == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          pip install -q -r requirements.txt

      - name: Unlock background music (YouTube Audio Library tracks, kept encrypted in this public repo)
        if: steps.due.outputs.go == 'true'
        env:
          MUSIC_KEY: ${{ secrets.MUSIC_KEY }}
        run: |
          if [ -n "$MUSIC_KEY" ]; then
            mkdir -p assets && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:MUSIC_KEY -in assets/music.tar.enc | tar -C assets -xf -
            ls assets/music | wc -l
          fi

      - name: Install OmniVoice narrator (free, CPU)
        if: steps.due.outputs.go == 'true'
        run: pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch torchaudio soundfile omnivoice

      - if: steps.due.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-omnivoice-v1

      - name: Make and upload the Short
        if: steps.due.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets[matrix.token] }}
          UPLOAD_PRIVACY: ${{ vars.UPLOAD_PRIVACY || 'private' }}
          PUBLISH_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_now }}
          AI_PER_VIDEO: "4"   # 6 Shorts a day share Cloudflare's free image allowance
        run: |
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
          flag=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" = "false" ]; then
            flag="--no-upload"
          fi
          python run.py short $flag $( [ "${{ github.event_name }}" = "schedule" ] && echo --ahead-hours 10 )
          rm -f token.json

      - name: Keep the finished video for 3 days
        if: always() && steps.due.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}-${{ github.run_number }}
          path: |
            output/*/final.mp4
            output/*/thumbnail.jpg
            output/*/script.json
            output/*/brief.txt
          retention-days: 3
          if-no-files-found: ignore

      - name: Save topic history
        if: always() && steps.due.outputs.go == 'true'
        run: |
          git config user.name "ytauto-bot"
          git config user.email "ytauto-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "history: ${{ matrix.profile }} short"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
