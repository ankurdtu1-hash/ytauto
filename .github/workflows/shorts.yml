name: shorts

# Every channel: one video a day, a Short, or a long video on Wednesdays and Sundays (config.LONG_DAYS). Every 2 hours each channel checks whether its daily publish slot is within
# 10 hours and has no video yet; then it makes one and schedules it on YouTube (publishAt) for that slot.
# A channel whose YouTube token secret is not set yet is skipped.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "which channel"
        type: choice
        options: [trending, main, cricket, animals, places, money]
        default: trending
      upload:
        description: "upload to YouTube"
        type: boolean
        default: true
      publish_now:
        description: "public right away (untick: next free time slot)"
        type: boolean
        default: true
      kind:
        description: "auto = long video on Wed/Sun, Short otherwise"
        type: choice
        options: [auto, short, long]
        default: auto

permissions:
  contents: write

jobs:
  # Decide which channels need a video now, so only those get a (heavy) job. Idle channels get no job at all,
  # which also stops an idle job from cancelling a real one waiting in the same per-channel queue.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      channels: ${{ steps.plan.outputs.channels }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          HAS_trending: ${{ secrets.YOUTUBE_TOKEN_JSON_TRENDING != '' }}
          HAS_main: ${{ secrets.YOUTUBE_TOKEN_JSON != '' }}
          HAS_cricket: ${{ secrets.YOUTUBE_TOKEN_JSON_CRICKET != '' }}
          HAS_animals: ${{ secrets.YOUTUBE_TOKEN_JSON_ANIMALS != '' }}
          HAS_places: ${{ secrets.YOUTUBE_TOKEN_JSON_PLACES != '' }}
          HAS_money: ${{ secrets.YOUTUBE_TOKEN_JSON_MONEY != '' }}
        run: |
          pip install -q python-dotenv
          list=""
          for p in trending main cricket animals places money; do
            has="HAS_$p"
            if [ "${!has}" != "true" ]; then echo "$p: no YouTube token yet"; continue; fi
            if [ "${{ github.event_name }}" = "schedule" ]; then
              hours=24; [ "$p" = trending ] && hours=12
              out=$(CHANNEL_PROFILE=$p GITHUB_OUTPUT=/dev/null python tools/due.py $hours); echo "$p: $out"
              case "$out" in *True) list="$list $p" ;; esac
            elif [ "${{ inputs.channel }}" = "$p" ]; then
              list="$list $p"
            fi
          done
          json=$(printf '%s\n' $list | python -c 'import json,sys; t={"main":"YOUTUBE_TOKEN_JSON"}; print(json.dumps([{"profile":p,"token":t.get(p,"YOUTUBE_TOKEN_JSON_"+p.upper())} for p in sys.stdin.read().split()]))')
          echo "channels=$json" >> "$GITHUB_OUTPUT"
          echo "to make now: $json"

  short:
    needs: plan
    if: needs.plan.outputs.channels != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 330   # long videos: ~1000 words of CPU narration
    strategy:
      fail-fast: false
      max-parallel: 2   # free Gemini / Cloudflare limits
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.channels) }}
    concurrency:
      group: short-${{ matrix.profile }}
      cancel-in-progress: false
    env:
      CHANNEL_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest history, not the commit this run started from (avoids making a video twice)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg, fonts and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          pip install -q -r requirements.txt

      - name: Unlock background music (YouTube Audio Library tracks, kept encrypted in this public repo)
        env:
          MUSIC_KEY: ${{ secrets.MUSIC_KEY }}
        run: |
          if [ -n "$MUSIC_KEY" ]; then
            mkdir -p assets && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:MUSIC_KEY -in assets/music.tar.enc | tar -C assets -xf -
            ls assets/music | wc -l
          fi

      - name: Install OmniVoice narrator (free, CPU)
        run: pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch torchaudio soundfile omnivoice

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-omnivoice-v1

      - name: Make and upload the video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets[matrix.token] }}
          UPLOAD_PRIVACY: ${{ vars.UPLOAD_PRIVACY || 'private' }}
          PUBLISH_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_now }}
          AI_PER_VIDEO: "4"   # 6 Shorts a day share Cloudflare's free image allowance
        run: |
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
          flag=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" = "false" ]; then
            flag="--no-upload"
          fi
          python run.py ${{ inputs.kind || 'auto' }} $flag $( [ "${{ github.event_name }}" = "schedule" ] && echo --ahead-hours $( [ "${{ matrix.profile }}" = trending ] && echo 12 || echo 24 ) )
          rm -f token.json

      - name: Keep the finished video for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}-${{ github.run_number }}
          path: |
            output/*/final.mp4
            output/*/thumbnail.jpg
            output/*/script.json
            output/*/brief.txt
          retention-days: 3
          if-no-files-found: ignore

      - name: Save topic history
        if: always()
        run: |
          git config user.name "ytauto-bot"
          git config user.email "ytauto-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "history: ${{ matrix.profile }} video"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
