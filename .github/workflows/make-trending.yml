name: make-trending

# Second channel: Shorts about what India is searching right now.
on:
  schedule:
    - cron: "37 3 * * *"    # daily; GitHub starts 5-9 h late, so this lands ~14:00-18:00 IST
  workflow_dispatch:
    inputs:
      upload:
        description: "upload to YouTube"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: make-trending
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CHANNEL_PROFILE: trending
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core

      - run: pip install -r requirements.txt

      - name: Make and upload trending Short
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON_TRENDING }}
          UPLOAD_PRIVACY: ${{ vars.UPLOAD_PRIVACY || 'private' }}
          YOUTUBE_CATEGORY_ID: "24"
        run: |
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
          flag=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" = "false" ]; then
            flag="--no-upload"
          fi
          python run.py short $flag

      - name: Keep the finished video for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trending-${{ github.run_number }}
          path: |
            output/*/final.mp4
            output/*/script.json
            output/*/brief.txt
          retention-days: 3
          if-no-files-found: ignore

      - name: Save topic history
        run: |
          git config user.name "ytauto-bot"
          git config user.email "ytauto-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "history: trending short"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
