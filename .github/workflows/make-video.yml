name: make-video

on:
  schedule:
    - cron: "0 12 * * *"    # Short every day, 17:30 IST
    - cron: "30 2 * * 0"    # Long video every Sunday, 08:00 IST
  workflow_dispatch:
    inputs:
      kind:
        description: "short or long"
        type: choice
        options: [short, long]
        default: short
      upload:
        description: "upload to YouTube"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: make-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core

      - run: pip install -r requirements.txt

      - name: Decide video type
        id: kind
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.kind }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 2 * * 0" ]; then
            echo "kind=long" >> "$GITHUB_OUTPUT"
          else
            echo "kind=short" >> "$GITHUB_OUTPUT"
          fi

      - name: Make and upload video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          UPLOAD_PRIVACY: ${{ vars.UPLOAD_PRIVACY || 'private' }}
        run: |
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
          flag=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" = "false" ]; then
            flag="--no-upload"
          fi
          python run.py "${{ steps.kind.outputs.kind }}" $flag

      - name: Keep the finished video for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.kind.outputs.kind }}-${{ github.run_number }}
          path: |
            output/*/final.mp4
            output/*/thumbnail.jpg
            output/*/script.json
            output/*/brief.txt
          retention-days: 3
          if-no-files-found: ignore

      - name: Save topic history
        run: |
          git config user.name "ytauto-bot"
          git config user.email "ytauto-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "history: ${{ steps.kind.outputs.kind }} video"
          git push
