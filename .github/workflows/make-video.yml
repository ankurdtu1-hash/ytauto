name: make-video

on:
  schedule:
    # Check every 2 hours; a Short is made only when the next free publish slot (11:00, 20:30 IST) is within 14 hours.
    - cron: "37 1-23/2 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "short or long"
        type: choice
        options: [short, long]
        default: short
      upload:
        description: "upload to YouTube"
        type: boolean
        default: true
      publish_now:
        description: "public right away (untick: next free time slot)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: make-video
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.due.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - name: Is a video needed for the next publish slot?
        id: due
        env:
          CHANNEL_PROFILE: main
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          pip install -q python-dotenv
          python tools/due.py 14

  video:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core

      - run: pip install -r requirements.txt

      - name: Unlock background music (YouTube Audio Library tracks, kept encrypted in this public repo)
        env:
          MUSIC_KEY: ${{ secrets.MUSIC_KEY }}
        run: |
          if [ -n "$MUSIC_KEY" ]; then
            mkdir -p assets && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:MUSIC_KEY -in assets/music.tar.enc | tar -C assets -xf -
            ls assets/music | wc -l
          fi

      - name: Install OmniVoice narrator (free, CPU)
        run: pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch torchaudio soundfile omnivoice

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-omnivoice-v1

      - name: Decide video type
        id: kind
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.kind }}" >> "$GITHUB_OUTPUT"
          else
            echo "kind=short" >> "$GITHUB_OUTPUT"
          fi

      - name: Make and upload video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          UPLOAD_PRIVACY: ${{ vars.UPLOAD_PRIVACY || 'private' }}
          PUBLISH_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_now }}
        run: |
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
          flag=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" = "false" ]; then
            flag="--no-upload"
          fi
          python run.py "${{ steps.kind.outputs.kind }}" $flag $( [ "${{ github.event_name }}" = "schedule" ] && echo --ahead-hours 14 )

      - name: Keep the finished video for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.kind.outputs.kind }}-${{ github.run_number }}
          path: |
            output/*/final.mp4
            output/*/thumbnail.jpg
            output/*/script.json
            output/*/brief.txt
          retention-days: 3
          if-no-files-found: ignore

      - name: Save topic history
        run: |
          git config user.name "ytauto-bot"
          git config user.email "ytauto-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "history: ${{ steps.kind.outputs.kind }} video"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
