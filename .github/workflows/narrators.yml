name: narrators

# One-off: design a separate narrator voice for each new channel (OmniVoice voice design, no real person).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        profile: [cricket, animals, places, money]
    env:
      CHANNEL_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -q -r requirements.txt
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch torchaudio soundfile omnivoice
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-omnivoice-v1
      - run: python tools/make_narrator.py
      - uses: actions/upload-artifact@v4
        with:
          name: narrator-${{ matrix.profile }}
          path: assets/voice/narrator_${{ matrix.profile }}.wav

  save:
    needs: voice
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets/voice
          pattern: narrator-*
          merge-multiple: true
      - run: |
          git config user.name "ytauto-bot"
          git config user.email "ytauto-bot@users.noreply.github.com"
          git add assets/voice/
          git diff --cached --quiet || git commit -m "Narrator voices for the new channels"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
