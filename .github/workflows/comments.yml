name: comments

# Reply to new viewer comments on both channels, once a day at 13:00 IST: just before YouTube's daily API
# quota resets (13:30 IST), so replies only use what the day's uploads left over.
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

jobs:
  reply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          T1: ${{ secrets.YOUTUBE_TOKEN_JSON_TRENDING }}
          T2: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          T3: ${{ secrets.YOUTUBE_TOKEN_JSON_CRICKET }}
          T4: ${{ secrets.YOUTUBE_TOKEN_JSON_ANIMALS }}
          T5: ${{ secrets.YOUTUBE_TOKEN_JSON_PLACES }}
          T6: ${{ secrets.YOUTUBE_TOKEN_JSON_MONEY }}
        run: |
          files=""; for n in 1 2 3 4 5 6; do v="T$n"; if [ -n "${!v}" ]; then printf '%s' "${!v}" > t$n.json; files="$files t$n.json"; fi; done
          python tools/comments.py $files
          rm -f t?.json
