name: comments

# Reply to new viewer comments on both channels, once a day at 13:00 IST: just before YouTube's daily API
# quota resets (13:30 IST), so replies only use what the day's uploads left over.
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

jobs:
  reply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          T1: ${{ secrets.YOUTUBE_TOKEN_JSON_TRENDING }}
          T2: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          printf '%s' "$T1" > t1.json; printf '%s' "$T2" > t2.json
          python tools/comments.py t1.json t2.json
          rm -f t1.json t2.json
